{% assign page_title = page.title | default: site.title %}
{% assign page_description = page.description | default: site.description %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f8f6f0">
    <meta name="description" content="{{ page_description | strip_newlines | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:title" content="{{ page_title | escape }}">
    <meta property="og:description" content="{{ page_description | strip_newlines | escape }}">
    <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <title>
      {% if page_title == "Home" or page_title == site.title %}
        {{ site.title | escape }}
      {% else %}
        {{ page_title | escape }} · {{ site.title | escape }}
      {% endif %}
    </title>
  </head>
